<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archives Pancartes</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1.5rem; background: #111; color: #eee; }
    h1 { text-align: center; margin-bottom: 2rem; font-size: 1.5rem; }
    .gallery { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
      gap: 1rem; 
      max-width: 1400px; 
      margin: 0 auto; 
    }
    .gallery img { 
      width: 100%; 
      height: 320px; 
      object-fit: cover; 
      border-radius: 6px; 
      background: #222;
      display: block;
      transition: transform 0.2s;
    }
    .gallery img:hover { transform: scale(1.02); }
  </style>
</head>
<body>

  <h1>Archives des Pancartes</h1>
  <div class="gallery" id="galerie"></div>

  <script>
    // Remplace par ton pseudo et le nom de ton dépôt
    const USER = "EmilienB-Bop";
    const REPO = "pancartes";

    fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/photos`)
      .then(res => res.json())
      .then(files => {
        const container = document.getElementById('galerie');
        // Filtre uniquement les fichiers images
        const images = files.filter(f => /\.(jpe?g|png|webp)$/i.test(f.name));
        
        images.reverse().forEach(img => {
          const el = document.createElement('a');
          el.href = img.download_url;
          el.target = "_blank";
          el.innerHTML = `<img src="${img.download_url}" alt="Pancarte" loading="lazy">`;
          container.appendChild(el);
        });
      })
      .catch(err => console.error("Erreur de chargement :", err));
  </script>
</body>
</html>
